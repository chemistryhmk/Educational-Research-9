.tabs{display:flex;gap:6px;margin:12px 0}

.sol{overflow-x:auto}.sol td,.sol th{text-align:center}.sr{background:#cfeedd;color:#14532d}.sn{background:#f7d4cd;color:#7f1d1d}.sm{background:#fbe9b5;color:#6b4a00}

<main>
<h1>Навчальне дослідження № 9</h1>
<p class="mu">Реакції між розчинами солей, кислот і основ. Проводь досліди у віртуальній лабораторії, спостерігай і роби власні висновки: теорію ти вивчатимеш уже після цього.</p>

<script>
const OBS={w:"Випадає білий осад",c:"Випадає кремовий осад",y:"Випадає жовтий осад",g:"Виділяються бульбашки газу",n:"Видимих змін немає",i:"Змінюється колір індикатора"};
const SED={w:"#fbfbf8",c:"#efe3a8",y:"#ecd93c"};
const R="#e0443e",V="#8a5bb5";
const E=[
{n:"Дослід 1. Натрій карбонат",d:"У дві пробірки налито по 1 мл розчину Na₂CO₃. Додай реактиви.",t:[
{a:"Na₂CO₃ + HCl",add:"Додати кілька крапель HCl",obs:"g",l0:"#bcd9f5",eq:["Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑","Na₂CO₃ + 2HCl → 2NaCl + CaCO₃↓","Na₂CO₃ + HCl → NaCl₂ + H₂CO₃"],
 x:{q:"Ця реакція оборотна чи необоротна?",o:["Необоротна: газ залишає розчин, тож продукти не можуть прореагувати назад","Оборотна: газ повертається в розчин","Оборотна: утворюється осад"],f:"Так — газ полишає пробірку."}},
{a:"Na₂CO₃ + CaCl₂",form:"fine",add:"Додати 1 мл CaCl₂",obs:"w",l0:"#bcd9f5",eq:["Na₂CO₃ + CaCl₂ → CaCO₃↓ + 2NaCl","Na₂CO₃ + CaCl₂ → CaCO₃ + NaCl₂","Na₂CO₃ + CaCl₂ → реакція не відбувається"],
 x:{q:"А якщо замість розчину Na₂CO₃ узяти нерозчинний MgCO₃ і додати CaCl₂?",o:["Реакція не піде: нерозчинна сіль майже не дає в розчин частинок для обміну","Піде так само, випаде осад CaCO₃","Виділиться газ"],f:"Зверни увагу: з кислотою MgCO₃ усе ж прореагує — кислота розчиняє його з виділенням CO₂."}}]},
{n:"Дослід 2. Барій хлорид",d:"У дві пробірки налито по 1 мл розчину BaCl₂.",t:[
{a:"BaCl₂ + Na₂SO₄",form:"fine",add:"Додати 1 мл Na₂SO₄",obs:"w",l0:"#bcd9f5",eq:["BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl","BaCl₂ + Na₂SO₄ → BaNa₂ + SO₄Cl₂","BaCl₂ + Na₂SO₄ → реакція не відбувається"]},
{a:"BaCl₂ + AgNO₃",form:"curd",add:"Додати кілька крапель AgNO₃",obs:"w",l0:"#bcd9f5",eq:["BaCl₂ + 2AgNO₃ → 2AgCl↓ + Ba(NO₃)₂","BaCl₂ + AgNO₃ → BaNO₃ + AgCl₂","BaCl₂ + 2AgNO₃ → реакція не відбувається"],
 x:{q:"Придивись до осадів у пробірках і в лупі. Чи відрізняються осади в обох пробірках? (Сирнистий осад — пухкі пластівці й грудки; дрібнокристалічний — дрібний порошок.)",o:["Так: різний склад (BaSO₄ та AgCl), а AgCl ще й сирнистий на вигляд, тоді як BaSO₄ дрібнокристалічний","Ні: це та сама речовина","Склад різний, а вигляд цілком однаковий"],f:"Осади мають різний склад і трохи різний вигляд."}}]},
{n:"Дослід 3. Аргентум(1+) нітрат і чотири солі Калію",d:"У чотири пробірки налито по 1 мл розчинів KCl, KBr, KI, K₃PO₄. У кожну додай AgNO₃.",t:[
{a:"KCl + AgNO₃",form:"curd",add:"Додати 1 мл AgNO₃",obs:"w",l0:"#bcd9f5",eq:["KCl + AgNO₃ → AgCl↓ + KNO₃","KCl + AgNO₃ → KAg + NO₃Cl","KCl + AgNO₃ → реакція не відбувається"]},
{a:"KBr + AgNO₃",form:"curd",add:"Додати 1 мл AgNO₃",obs:"c",l0:"#bcd9f5",eq:["KBr + AgNO₃ → AgBr↓ + KNO₃","KBr + AgNO₃ → KAg + NO₃Br","KBr + AgNO₃ → реакція не відбувається"]},
{a:"KI + AgNO₃",form:"curd",add:"Додати 1 мл AgNO₃",obs:"y",l0:"#bcd9f5",eq:["KI + AgNO₃ → AgI↓ + KNO₃","KI + AgNO₃ → KAg + NO₃I","KI + AgNO₃ → реакція не відбувається"]},
{a:"K₃PO₄ + AgNO₃",form:"fine",add:"Додати 1 мл AgNO₃",obs:"y",l0:"#bcd9f5",sed:"#f3e25c",eq:["K₃PO₄ + 3AgNO₃ → Ag₃PO₄↓ + 3KNO₃","K₃PO₄ + AgNO₃ → KAg + PO₄NO₃","K₃PO₄ + 3AgNO₃ → реакція не відбувається"],
 x:{q:"Порівняй осади в лупі та на дні пробірок (пластівці чи порошок, колір). Чи відрізняються осади в усіх чотирьох пробірках?",o:["За складом усі різні (AgCl, AgBr, AgI, Ag₃PO₄), за кольором — від білого до жовтого","Усі однакові, бо в усіх є Аргентум","Відрізняються лише розчини, а осади однакові"],f:"Різні аніони дають різні осади."}}]},
{n:"Дослід 4. Сульфатна кислота з індикатором",d:"У чотири пробірки налито по 1 мл H₂SO₄ і кілька крапель лакмусу (в кислоті він червоний).",t:[
{a:"H₂SO₄ + NaOH",add:"Додавати краплями NaOH до нейтрального",obs:"i",l0:R,l1:V,eq:["H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O","H₂SO₄ + NaOH → NaSO₄ + H₂O","H₂SO₄ + 2NaOH → Na₂SO₄ + H₂↑"],
 x:{q:"Якби цю реакцію проводили без індикатора, чи були б помітні зміни? Чи відбувалася б реакція?",o:["Змін не видно, але реакція відбувається (утворюється вода)","Змін не видно, бо реакції немає","Випав би осад"],f:"Саме тому індикатор потрібен — він «показує» реакцію."}},
{a:"H₂SO₄ + BaCl₂",form:"fine",add:"Додати 1 мл BaCl₂",obs:"w",l0:R,eq:["H₂SO₄ + BaCl₂ → BaSO₄↓ + 2HCl","H₂SO₄ + BaCl₂ → BaCl₂SO₄ + H₂","H₂SO₄ + BaCl₂ → реакція не відбувається"],
 x:{q:"Чи змінилася кислотність середовища?",o:["Ні: колір індикатора лишився червоним — у розчині є кислота (HCl)","Так: розчин став нейтральним","Так: розчин став лужним"],f:"Осад утворився, але кислота в розчині залишилась."}},
{a:"H₂SO₄ + Na₂SO₃",add:"Додати 1 мл Na₂SO₃",obs:"g",l0:R,eq:["H₂SO₄ + Na₂SO₃ → Na₂SO₄ + H₂O + SO₂↑","H₂SO₄ + Na₂SO₃ → Na₂SO₄ + BaSO₃↓","H₂SO₄ + Na₂SO₃ → реакція не відбувається"],
