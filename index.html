<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Навчальне дослідження № 9 — Реакції йонного обміну</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--tx:#17302f;--mu:#5a7371;--ac:#0f8b8d;--ac2:#d9efee;--bd:#9db8b6;--ok:#1f8a4c;--okb:#dff3e6;--no:#b3321f;--nob:#fbe4df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1c;--card:#172928;--tx:#e4f1ef;--mu:#9ab8b5;--ac:#3cc0c2;--ac2:#1f3b3a;--bd:#4b6d6b;--ok:#6fdc9a;--okb:#1b3a28;--no:#ff9a88;--nob:#40201b}}
:root[data-theme="dark"]{--bg:#0f1c1c;--card:#172928;--tx:#e4f1ef;--mu:#9ab8b5;--ac:#3cc0c2;--ac2:#1f3b3a;--bd:#4b6d6b;--ok:#6fdc9a;--okb:#1b3a28;--no:#ff9a88;--nob:#40201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Georgia,"Times New Roman",serif}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 26px/1.2 "Trebuchet MS",Verdana,sans-serif;margin:6px 0 4px}
h2{font:700 21px/1.3 "Trebuchet MS",Verdana,sans-serif;margin:22px 0 8px}
p{margin:6px 0}.mu{color:var(--mu);font-size:15px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
nav button{font:600 14px "Trebuchet MS",Verdana,sans-serif;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .5s}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;margin:14px 0}
.credits{border-left:4px solid var(--ac);font-size:14px;line-height:1.5;background:var(--ac2);padding:12px 14px;border-radius:0 10px 10px 0;margin-top:16px}
.credits p{margin:4px 0}

.top-bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 4px}
.btn-reset{font:600 13px "Trebuchet MS",Verdana,sans-serif;background:transparent;color:var(--no);border:1px solid var(--no);border-radius:8px;padding:4px 10px;cursor:pointer;transition:all .2s}
.btn-reset:hover{background:var(--nob)}

.cover-container{position:relative;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.15);cursor:pointer;margin-bottom:16px;background:var(--card)}
.cover-container img{width:100%;height:auto;display:block;transition:transform .25s ease}
.cover-container:hover img{transform:scale(1.008)}

.lab{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bench{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:130px}
.tube{position:relative;width:54px;height:130px;border:3px solid var(--bd);border-top:none;border-radius:0 0 28px 28px;overflow:hidden;background:rgba(150,190,190,.12)}
.liq{position:absolute;left:0;right:0;bottom:0;height:65%;transition:background 1.2s,opacity 1.2s}
.sed{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1.6s}
.b{position:absolute;bottom:4px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid #7aa;opacity:0}
.gas .b{animation:rise 1.3s infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-100px);opacity:0}}
@media (prefers-reduced-motion:reduce){.gas .b{animation:none;opacity:1;transform:translateY(-40px)}.liq,.sed{transition:none}}
.lbl{font:600 14px "Trebuchet MS",Verdana,sans-serif;text-align:center}

/* Стилі для кнопок навігації */
.btn{font:700 15px "Trebuchet MS",Verdana,sans-serif;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:all .2s ease}
.btn:disabled{opacity:.45;cursor:default}

.btn-next{font:700 16px "Trebuchet MS",Verdana,sans-serif;background:linear-gradient(135deg,#0f8b8d,#0b6e70);color:#fff;border:0;border-radius:12px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 14px rgba(15,139,141,.35);transition:transform .15s,box-shadow .15s}
.btn-next:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,139,141,.45)}
.btn-next:disabled{opacity:.4;cursor:default;box-shadow:none}

.btn-prev{font:600 15px "Trebuchet MS",Verdana,sans-serif;background:transparent;color:var(--mu);border:2px solid var(--bd);border-radius:12px;padding:10px 20px;cursor:pointer;transition:all .15s}
.btn-prev:hover:not(:disabled){background:var(--bg);color:var(--tx);border-color:var(--ac)}
.btn-prev:disabled{opacity:.3;cursor:default}

.qs{flex:1;min-width:240px}
.q{margin:0 0 12px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
.q p{font-weight:700}
.o{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.ok{background:var(--okb);border-color:var(--ok)}.o.bad{background:var(--nob);border-color:var(--no);opacity:.8}
.fb{font-size:15px;margin-top:4px}.fb.g{color:var(--ok)}.fb.r{color:var(--no)}
.done{color:var(--ok);font-weight:700}
details{margin:8px 0;font-size:15px}summary{cursor:pointer;font-weight:700;color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:5px 8px;text-align:left}
textarea{width:100%;min-height:110px;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:8px}
.go{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.o:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.fl{display:block;margin:10px 0}.fl span{display:block;font-weight:700;margin-bottom:4px}
.fl input,.fl textarea{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:9px}
.fl input:focus,.fl textarea:focus{outline:3px solid var(--ac);outline-offset:1px}
.fl-hint{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:3px}
.fl-hint.ok{color:var(--ok);font-weight:600}
nav button:disabled{opacity:.4;cursor:default}
.tt{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#b3321f;color:#fff;padding:10px 16px;border-radius:10px;font:600 15px "Trebuchet MS",Verdana,sans-serif;z-index:20;max-width:90%}

.st{position:relative;width:280px;height:300px;border-radius:14px;overflow:hidden;border:2px solid var(--bd);background:#cdd9dd}
.sv{position:absolute;left:0;top:0;width:280px;height:300px;pointer-events:none;z-index:0}.sv.f{z-index:3}
.tb{position:absolute;top:64px;width:34px;height:186px;box-sizing:border-box;border:2px solid rgba(90,120,125,.6);border-top:4px solid rgba(90,120,125,.45);border-radius:0 0 17px 17px;overflow:hidden;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 35%,rgba(255,255,255,.3) 85%)}
.tb::after{content:"";position:absolute;left:4px;top:0;bottom:14px;width:5px;border-radius:3px;background:rgba(255,255,255,.65);z-index:3}
.lq{position:absolute;left:0;right:0;bottom:0;height:50%;transition:height 1.2s,background 1.2s}
.lq::before{content:"";position:absolute;left:0;right:0;top:-3px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);z-index:2}
.cl{position:absolute;inset:0;background:var(--p,#fff);opacity:0;transition:opacity 1.6s}
.fo{position:absolute;left:0;right:0;top:-7px;height:0;transition:height 1s;border-radius:6px 6px 0 0;background:radial-gradient(circle at 20% 60%,#fff 0 3px,transparent 4px),radial-gradient(circle at 60% 40%,#fff 0 4px,transparent 5px),radial-gradient(circle at 85% 70%,#fff 0 3px,transparent 4px) rgba(255,255,255,.6);z-index:2}
.sd{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 3s ease-in;background:var(--p,#fff);border-radius:50% 50% 0 0/14% 14% 0 0;box-shadow:0 -2px 4px rgba(0,0,0,.15)}
.bs{display:none}.gas .bs{display:block}
.bs i{position:absolute;bottom:6px;border-radius:50%;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.35);opacity:0;animation:rs 1.6s linear infinite;z-index:2}
@keyframes rs{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-95px);opacity:0}}
.bot{position:absolute;left:10px;top:158px;width:56px;z-index:1}
.cap{display:block;width:20px;height:30px;margin:0 auto;background:linear-gradient(90deg,#111,#444,#111);border-radius:10px 10px 3px 3px}
.bd{display:block;position:relative;height:80px;margin-top:-1px;border-radius:12px 12px 8px 8px;background:linear-gradient(90deg,#5a3410,#c08038 40%,#5a3410)}
.bd em{position:absolute;left:5px;right:5px;top:24px;height:32px;display:flex;align-items:center;justify-content:center;background:#fff;color:#222;font:700 12px "Trebuchet MS",Verdana,sans-serif}
.pp{position:absolute;left:162px;top:-80px;width:16px;z-index:4;transition:top .7s}.go .pp{top:-8px}
.bulb{display:block;width:16px;height:22px;border-radius:8px 8px 3px 3px;background:linear-gradient(90deg,#8e1b1b,#e05555,#8e1b1b)}
.gl{display:block;margin:0 auto;width:8px;height:46px;background:rgba(255,255,255,.85);clip-path:polygon(0 0,100% 0,100% 72%,62% 100%,38% 100%,0 72%)}
.dp{position:absolute;left:168px;top:58px;width:5px;height:7px;border-radius:50%/60% 60% 40% 40%;background:rgba(120,165,200,.9);z-index:4;animation:dr .55s ease-in forwards}
@keyframes dr{from{transform:translateY(0);opacity:1}to{transform:translateY(88px);opacity:.2}}
.zm{position:absolute;left:186px;top:10px;width:70px;height:70px;box-sizing:border-box;border:5px solid #5b6b70;border-radius:50%;background:rgba(200,222,238,.8);z-index:4;opacity:0;transition:opacity 1s}
.zm::after{content:"";position:absolute;right:-13px;top:-9px;width:8px;height:26px;border-radius:4px;background:#3c4a4e;transform:rotate(45deg)}
.zm i{position:absolute;inset:0;border-radius:50%}.zm.on{opacity:1}
.zm.fine i{background:radial-gradient(circle,var(--p) 0 1px,transparent 1.3px) 1px 1px/5px 5px,radial-gradient(circle,rgba(0,0,0,.4) 0 1.8px,transparent 2.1px) 0 0/5px 5px}
.zm.curd i{background:radial-gradient(ellipse 9px 6px at 50% 50%,var(--p) 0 75%,rgba(0,0,0,.45) 88%,transparent 100%) 0 0/24px 18px,radial-gradient(ellipse 7px 5px at 50% 50%,var(--p) 0 70%,rgba(0,0,0,.45) 88%,transparent 100%) 11px 9px/19px 15px}
.sd.fine{border-radius:0;background:radial-gradient(circle,rgba(0,0,0,.28) 0 .6px,transparent .9px) 0 0/3px 3px,var(--p)}
.sd.curd{border-radius:0;clip-path:polygon(0 22%,10% 8%,22% 24%,36% 6%,50% 20%,64% 4%,78% 22%,90% 8%,100% 18%,100% 100%,0 100%);background:radial-gradient(ellipse 5px 4px at 50% 50%,rgba(0,0,0,.2) 0 60%,transparent 70%) 0 0/11px 9px,var(--p)}
.fk{position:absolute;width:7px;height:5px;border-radius:45% 55% 50% 50%;background:var(--p,#fff);box-shadow:0 0 0 1px rgba(0,0,0,.3);opacity:0;z-index:2}
.rain .fk{animation:fkf 2.4s ease-in forwards}
@keyframes fkf{0%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(38px)}}
.fin *{transition:none!important}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{font:600 14px "Trebuchet MS",Verdana,sans-serif;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sol{overflow-x:auto}.sol td,.sol th{text-align:center}.sr{background:#cfeedd;color:#14532d}.sn{background:#f7d4cd;color:#7f1d1d}.sm{background:#fbe9b5;color:#6b4a00}
@media (prefers-reduced-motion:reduce){.bs i{animation:none;opacity:.8;bottom:30px}.pp{transition:none}}

.score-box{background:linear-gradient(135deg,var(--ac2),var(--card));border:2px solid var(--ac);border-radius:12px;padding:16px;margin:14px 0}
.score-box h3{margin:0 0 8px;color:var(--ac);font-family:"Trebuchet MS",sans-serif}
.notice-box{background:#fff8e6;border:2px solid #f59e0b;border-radius:12px;padding:14px 16px;margin:16px 0;color:#78350f}
.notice-box p{margin:4px 0}
.lbl2{display:none;font-size:13px;color:var(--mu);text-align:center;margin-top:2px;max-width:280px}body.acc .lbl2.on{display:block}
.o.sel{border-color:var(--ac);background:var(--ac2)}

/* ===== Адаптивне розташування (комп’ютер / планшет / телефон) ===== */
main{max-width:1280px;padding:10px 20px 40px}
#header-area{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 20px}
#header-area h1{margin:2px 0}
#header-area p{margin:0;flex:1 1 320px;font-size:14px}
nav{margin:8px 0 2px}.bar{margin:6px 0}
.go{position:sticky;bottom:0;z-index:6;gap:10px;margin-top:6px;padding:18px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.go #why{flex:1;margin:0;text-align:center;font-size:13px}
.qs{min-width:min(240px,100%)}
#tbl{max-width:900px}
.col>h2:first-child{margin-top:6px}
@media (min-width:1000px){
 #v.s0{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0 24px;align-items:stretch}
 .s0>.cover-container{grid-column:1;grid-row:1;margin:14px 0 0}
 .s0>.cover-container img{height:100%;object-fit:cover}
 .s0>.card{grid-column:2;grid-row:1;margin:14px 0 0;display:flex;flex-direction:column;justify-content:center}
 .s0>.credits{grid-column:1/-1;grid-row:2;margin-top:16px}
 #v.s1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
 #v.s2,#v.s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:0 28px;align-items:start}
 .s2>h2,.s2>p,.s3>h2,.s3>p{grid-column:1}
 .s2>.card,.s3>.card{grid-column:2;grid-row:1/span 3}
 .s0>.go,.s1>.go,.s2>.go,.s3>.go,.s8>.go,.s8>.credits{grid-column:1/-1}
}
@media (max-width:700px){
 main{padding:8px 10px 24px}
 h1{font-size:21px}h2{font-size:19px;margin:14px 0 6px}
 .card{padding:12px;margin:10px 0}
 nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
 nav button{white-space:nowrap;flex:0 0 auto}
 .tabs{flex-wrap:wrap}
 .o{padding:11px 12px}
 .qs,.bench{width:100%}
 .btn-next{padding:12px 18px;font-size:15px}.btn-prev{padding:10px 12px;font-size:14px}
 .go{flex-wrap:wrap}.go #why{order:3;flex-basis:100%}
 #header-area p{font-size:13px}
}
@media (max-width:340px){.st{zoom:.9}}

/* ===== Компактніше: одна пробірка на екран, вкладки у висновках ===== */
#header-area h1{margin:0;font-size:24px}
nav{margin:6px 0 2px}.bar{margin:4px 0}.top-bar-row{margin:2px 0 0}
.sx>h2{margin:8px 0 2px}.sx>p{margin:2px 0}.tabs{margin:8px 0}
.bench .btn{max-width:284px;white-space:normal;line-height:1.25}
.card[hidden],.pane[hidden]{display:none}
.trp{margin:2px 0 6px}
.q.dn .o:not(.ok){display:none}
.s8 textarea{min-height:84px}
@media (min-width:1000px){
 .sx .q{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
 .sx .q>p,.sx .q>.fb{grid-column:1/-1}
 .sx .q.dn{display:block}
 .sx .qs>.o{display:inline-block;width:calc(50% - 5px);margin:3px 5px 3px 0;vertical-align:top}
}

/* ===== Титул: компактна форма, підвал авторства у дві колонки ===== */
.s0 #f{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:end}
.s0 #f .btn-next{margin:10px 0;width:100%}
.s0 .credits{columns:2 320px;column-gap:32px}
.s0 .credits p{break-inside:avoid;margin:4px 0}
@media (max-width:560px){.s0 #f{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g-wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f6"/><stop offset="1" stop-color="#c9d6da"/></linearGradient><linearGradient id="g-tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfa877"/><stop offset="1" stop-color="#8a5f30"/></linearGradient><linearGradient id="g-wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dca96b"/><stop offset="1" stop-color="#a06c36"/></linearGradient><linearGradient id="g-wv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b17639"/><stop offset=".5" stop-color="#d9a468"/><stop offset="1" stop-color="#9b6630"/></linearGradient></defs></svg>
<main>
<div id="header-area">
  <h1>Навчальне дослідження № 9</h1>
  <p class="mu">Реакції між розчинами солей, кислот і основ. Проводь досліди у віртуальній лабораторії, спостерігай і роби власні висновки: теорію ти вивчатимеш уже після цього.</p>
</div>
<nav id="nav"></nav>
<div class="bar" id="bar-wrap"><i id="pr"></i></div>
<div class="top-bar-row">
  <p class="mu" id="sc" style="margin:0"></p>
  <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="mu" style="font-size:13px;cursor:pointer"><input type="checkbox" id="acc"> Підписи кольорів</label><button class="btn-reset" onclick="resetAllProgress()" title="Очистити збережені дані та почати з нуля">Скинути роботу ↻</button></span>
</div>
<section id="v"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function calcAutoScore(){
  let s = 0;

  let labPoints = (doneN * 0.5) - (err * 0.25);

}

function guard(el,key,minLen){
 el.setAttribute("autocomplete","off");el.setAttribute("autocorrect","off");el.setAttribute("autocapitalize","off");el.spellcheck=false;
 let last=el.value;
 if(!inputStats[key]) inputStats[key] = {keys:0, len:0};

 const stop=e=>{e.preventDefault();e.stopPropagation();warn()};

 ["paste","drop","dragstart","contextmenu"].forEach(t=>el.addEventListener(t,stop));

 el.addEventListener("keydown",e=>{
   const k=(e.key||"").toLowerCase();
   if(((e.ctrlKey||e.metaKey)&&(k==="v"||k==="x"||k==="c"))||(e.shiftKey&&k==="insert")) {
     stop(e); return;
   }
   if(e.key.length === 1 || e.key === "Backspace" || e.key === "Delete"){
     inputStats[key].keys++;
   }
 });

 el.addEventListener("beforeinput",e=>{
   if(/paste|drop|yank|insertFromPaste|insertFromDrop|insertReplacementText/i.test(e.inputType||"")){
     stop(e);
   }
 });

 el.addEventListener("compositionend",()=>{
   inputStats[key].keys += 2;
 });

 el.addEventListener("input",e=>{
   const diff = el.value.length - last.length;
   if(!e.isComposing && diff > 2){
     el.value = last;
     warn();
   } else {
     last = el.value;
     S[key] = el.value;
     inputStats[key].len = el.value.length;
     saveProgress();
     if(minLen){
       const hintEl = el.parentElement.querySelector('.fl-hint');
       if(hintEl){
         const cur = el.value.trim().length;
         if(cur >= minLen){
           hintEl.className = 'fl-hint ok';
           hintEl.innerHTML = `<span>✓ Достатньо символів</span><span>${cur} / ${minLen}</span>`;
         } else {
           hintEl.className = 'fl-hint';
           hintEl.innerHTML = `<span>Потрібно ще мінімум ${minLen - cur} симв.</span><span>${cur} / ${minLen}</span>`;
         }
       }
     }
     upd();
   }
 });
}

function getUnmetReason(i){
  if(i>=1&&!idOK()) return "Заповни прізвище, ім’я, клас, школу та населений пункт на титулі.";
  if(i>=3&&S.goal.trim().length<20) return "Сформулюй мету дослідження (ще мінімум " + (20 - S.goal.trim().length) + " симв.).";
  if(i>=4&&!safeOK) return "Щоб перейти до дослідів, правильно дай відповідь на всі запитання тесту з техніки безпеки.";
  if(i===8||step===8){
    if(doneN < total){
      const remaining = total - doneN;
      const miss=[];E.forEach((e,i)=>e.t.forEach((t,j)=>{if(!res[i+"_"+j])miss.push("Дослід "+(i+1)+": "+t.a)}));
      return "Не завершено "+remaining+" із "+total+" пробірок: "+miss.join("; ")+". Пробірка зараховується, коли дано відповіді на ВСІ її запитання (спостереження, рівняння, додаткове питання).";
    }
    if(S.d1.trim().length < 15) return "Напиши відповідь на питання 1 (ще мінімум " + (15 - S.d1.trim().length) + " симв.).";
    if(S.d2.trim().length < 15) return "Напиши відповідь на питання 2 (ще мінімум " + (15 - S.d2.trim().length) + " симв.).";

}
